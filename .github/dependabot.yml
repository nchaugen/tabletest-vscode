version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/Oslo"
    open-pull-requests-limit: 5
    versioning-strategy: "increase-if-necessary"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      linting:
        applies-to: "version-updates"
        patterns:
          - "eslint"
          - "@typescript-eslint/*"
      testing:
        applies-to: "version-updates"
        patterns:
          - "mocha"
          - "@types/mocha"
          - "@vscode/test-electron"
          - "vscode-tmgrammar-test"
      build-and-publishing:
        applies-to: "version-updates"
        patterns:
          - "typescript"
          - "@types/node"
          - "@vscode/vsce"
      linting-security:
        applies-to: "security-updates"
        patterns:
          - "eslint"
          - "@typescript-eslint/*"
      testing-security:
        applies-to: "security-updates"
        patterns:
          - "mocha"
          - "@types/mocha"
          - "@vscode/test-electron"
          - "vscode-tmgrammar-test"
      build-and-publishing-security:
        applies-to: "security-updates"
        patterns:
          - "typescript"
          - "@types/node"
          - "@vscode/vsce"
    # Keep VS Code API typings aligned with engines.vscode through manual bumps.
    ignore:
      - dependency-name: "@types/vscode"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:30"
      timezone: "Europe/Oslo"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      github-actions:
        applies-to: "version-updates"
        patterns:
          - "*"
      github-actions-security:
        applies-to: "security-updates"
        patterns:
          - "*"
