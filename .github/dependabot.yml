version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/Oslo"
    open-pull-requests-limit: 5
    versioning-strategy: "increase-if-necessary"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      linting:
        applies-to: "version-updates"
        patterns:
          - "eslint"
          - "@typescript-eslint/*"
      testing:
        applies-to: "version-updates"
        patterns:
          - "mocha"
          - "@types/mocha"
          - "@vscode/test-electron"
          - "vscode-tmgrammar-test"
      build-and-publishing:
        applies-to: "version-updates"
        patterns:
          - "@types/node"
          - "@vscode/vsce"
      linting-security:
        applies-to: "security-updates"
        patterns:
          - "eslint"
          - "@typescript-eslint/*"
      testing-security:
        applies-to: "security-updates"
        patterns:
          - "mocha"
          - "@types/mocha"
          - "@vscode/test-electron"
          - "vscode-tmgrammar-test"
      build-and-publishing-security:
        applies-to: "security-updates"
        patterns:
          - "@types/node"
          - "@vscode/vsce"
    ignore:
      # Keep VS Code API typings aligned with engines.vscode through manual bumps.
      - dependency-name: "@types/vscode"
      # Hold TypeScript below the typescript-eslint peer ceiling. The v8 plugin
      # declares "typescript@>=4.8.4 <6.1.0", so npm install fails above it.
      # Lift once typescript-eslint widens the range to TypeScript 7.
      - dependency-name: "typescript"
        versions: [">=6.1.0"]
      # mocha 12 is ESM-only and needs Node >=20.19. The VS Code 1.85 extension
      # host runs Node 18, so it cannot load it. Lift when engines.vscode rises.
      - dependency-name: "mocha"
        versions: [">=12.0.0"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:30"
      timezone: "Europe/Oslo"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      github-actions:
        applies-to: "version-updates"
        patterns:
          - "*"
      github-actions-security:
        applies-to: "security-updates"
        patterns:
          - "*"
