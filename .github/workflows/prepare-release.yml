name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example 0.0.7)
        required: true
        type: string
      dry_run:
        description: Update files and report the diff without opening a PR
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:
      - name: Validate branch
        run: |
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "Prepare Release must be run from main, not ${GITHUB_REF_NAME}."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare release files
        run: |
          args=("${{ inputs.version }}")
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            args+=("--dry-run")
          fi
          node ./scripts/prepare-release.cjs "${args[@]}"

      - name: Show release diff
        run: |
          echo "Prepared release ${VERSION}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          git diff --stat >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```diff' >> "$GITHUB_STEP_SUMMARY"
          git diff -- package.json package-lock.json CHANGELOG.md >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
        env:
          VERSION: ${{ inputs.version }}

      - name: Create release pull request
        if: ${{ !inputs.dry_run }}
        uses: peter-evans/create-pull-request@v8
        with:
          branch: release/v${{ inputs.version }}
          base: main
          commit-message: "chore: prepare v${{ inputs.version }}"
          title: "Prepare release v${{ inputs.version }}"
          body: |
            Prepare release `v${{ inputs.version }}`.

            This PR was generated by the `Prepare Release` workflow and includes:
            - `package.json` and `package-lock.json` version bump
            - curated `CHANGELOG.md` release section
            - updated changelog compare links
          labels: release
          add-paths: |
            package.json
            package-lock.json
            CHANGELOG.md
