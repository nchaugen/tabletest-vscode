name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm run test:unit

  integration:
    name: Integration (${{ matrix.compatibility-target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compatibility-target:
          - minimum-supported
          - stable

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve VS Code test version
        run: |
          if [ "${{ matrix.compatibility-target }}" = "minimum-supported" ]; then
            VERSION="$(node -p "const range = require('./package.json').engines.vscode; const match = range.match(/[0-9]+\.[0-9]+\.[0-9]+/); if (!match) { throw new Error('Could not resolve minimum VS Code version from engines.vscode'); } match[0]")"
          else
            VERSION="stable"
          fi
          echo "TABLETEST_VSCODE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Run integration tests
        run: xvfb-run -a npm run test:integration:strict

  web-integration:
    name: Web Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run web integration tests
        run: npm run test:integration:web
