name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag version ($TAG) does not match package.json version ($VERSION)."
            exit 1
          fi

      - name: Run unit tests
        run: npm run test:unit

      - name: Run strict integration tests
        run: xvfb-run -a npm run test:integration:strict

      - name: Extract curated release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node ./scripts/extract-release-notes.cjs "$VERSION" > RELEASE_NOTES.md

      - name: Build VSIX
        run: npm run package

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: |
            *.vsix
            RELEASE_NOTES.md
          if-no-files-found: error

  github-release:
    runs-on: ubuntu-latest
    needs: package
    permissions:
      contents: write
    environment: release

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: release-assets

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*.vsix
          body_path: release-assets/RELEASE_NOTES.md

  publish-marketplace:
    runs-on: ubuntu-latest
    needs: package
    environment: release

    steps:
      - name: Check Marketplace token
        id: check_token
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -n "$VSCE_PAT" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "VSCE_PAT is not set. Skipping Marketplace publish."
          fi

      - name: Setup Node
        if: ${{ steps.check_token.outputs.publish == 'true' }}
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Download release artifacts
        if: ${{ steps.check_token.outputs.publish == 'true' }}
        uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: release-assets

      - name: Publish to Visual Studio Marketplace
        if: ${{ steps.check_token.outputs.publish == 'true' }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx --yes @vscode/vsce publish --packagePath release-assets/*.vsix -p "$VSCE_PAT"

  publish-open-vsx:
    runs-on: ubuntu-latest
    needs: package
    environment: release

    steps:
      - name: Check Open VSX token
        id: check_token
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -n "$OVSX_PAT" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "OVSX_PAT is not set. Skipping Open VSX publish."
          fi

      - name: Setup Node
        if: ${{ steps.check_token.outputs.publish == 'true' }}
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Download release artifacts
        if: ${{ steps.check_token.outputs.publish == 'true' }}
        uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: release-assets

      - name: Publish to Open VSX
        if: ${{ steps.check_token.outputs.publish == 'true' }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx --yes ovsx publish release-assets/*.vsix -p "$OVSX_PAT"
