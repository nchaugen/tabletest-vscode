name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag version ($TAG) does not match package.json version ($VERSION)."
            exit 1
          fi

      - name: Run test suite
        run: npm test

      - name: Build VSIX
        run: npm run package

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: "*.vsix"
          if-no-files-found: error

  github-release:
    runs-on: ubuntu-latest
    needs: package
    permissions:
      contents: write

    steps:
      - name: Download VSIX artifact
        uses: actions/download-artifact@v8
        with:
          name: vsix
          path: release-assets

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*.vsix
          generate_release_notes: true

  publish-marketplace:
    runs-on: ubuntu-latest
    needs: package

    steps:
      - name: Check Marketplace token
        id: check_token
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -n "$VSCE_PAT" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "VSCE_PAT is not set. Skipping Marketplace publish."
          fi

      - name: Checkout
        if: ${{ steps.check_token.outputs.publish == 'true' }}
        uses: actions/checkout@v6

      - name: Setup Node
        if: ${{ steps.check_token.outputs.publish == 'true' }}
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        if: ${{ steps.check_token.outputs.publish == 'true' }}
        run: npm ci

      - name: Download VSIX artifact
        if: ${{ steps.check_token.outputs.publish == 'true' }}
        uses: actions/download-artifact@v8
        with:
          name: vsix
          path: release-assets

      - name: Publish to Visual Studio Marketplace
        if: ${{ steps.check_token.outputs.publish == 'true' }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx @vscode/vsce publish --packagePath release-assets/*.vsix -p "$VSCE_PAT"

  publish-open-vsx:
    runs-on: ubuntu-latest
    needs: package

    steps:
      - name: Check Open VSX token
        id: check_token
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -n "$OVSX_PAT" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "OVSX_PAT is not set. Skipping Open VSX publish."
          fi

      - name: Checkout
        if: ${{ steps.check_token.outputs.publish == 'true' }}
        uses: actions/checkout@v6

      - name: Setup Node
        if: ${{ steps.check_token.outputs.publish == 'true' }}
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        if: ${{ steps.check_token.outputs.publish == 'true' }}
        run: npm ci

      - name: Download VSIX artifact
        if: ${{ steps.check_token.outputs.publish == 'true' }}
        uses: actions/download-artifact@v8
        with:
          name: vsix
          path: release-assets

      - name: Publish to Open VSX
        if: ${{ steps.check_token.outputs.publish == 'true' }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx ovsx publish release-assets/*.vsix -p "$OVSX_PAT"
